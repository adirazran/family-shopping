<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קניות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>הקניות של הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app — header on top, scrolling list, add bar with suggestions pinned to the bottom. Market-stall palette: leaf green, tomato, paper. */
:root{
  --bg:#fbf8f1; --surface:#ffffff; --sunk:#f1ece0; --fg:#1d2a1f; --muted:#6b6f63;
  --leaf:#2f7a4a; --leaf-soft:#e3f2e6; --tomato:#d9482b; --line:#e6e0d2; --done:#9a9c92;
  color-scheme:light;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{padding-block:14px;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;color:var(--leaf);display:flex;align-items:center;gap:10px}
.count{background:var(--tomato);color:#fff;border-radius:999px;font-family:var(--body);font-weight:700;font-size:.8rem;min-width:24px;padding:2px 8px;text-align:center;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:8px;background:var(--sunk);border:0;border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.mute{border:0;background:var(--sunk);border-radius:999px;width:42px;height:42px;font-size:1.25rem;padding:0}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;flex:none}

.pane{flex:1;overflow-y:auto;padding-block:16px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;line-height:1.6}
.empty strong{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;color:var(--fg);margin-bottom:4px}

.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px}
.check{width:34px;height:34px;border-radius:8px;border:2px solid var(--leaf);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.item.done .check{background:var(--leaf);border-color:var(--leaf)}
.check svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.item.done .check svg{opacity:1}
.iname{flex:1;min-width:0;font-weight:700;font-size:1.3rem;overflow-wrap:anywhere}
.qty{color:var(--tomato);font-weight:700;margin-inline-start:6px}
.item.done .iname{text-decoration:line-through;color:var(--done);font-weight:600}
.item.done .qty{color:var(--done)}
.req{font-size:1rem;color:var(--muted);text-align:left;flex:none;max-width:40%}
.req b{color:var(--fg)}
.when{display:block;font-size:.88rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.new{background:var(--tomato);color:#fff;border-radius:6px;font-size:.8rem;font-weight:700;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.item.done .req{color:var(--done)}
.del{border:0;background:none;color:var(--muted);font-size:1.7rem;padding:0 6px;line-height:1}
.del:hover{color:var(--tomato)}
.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 8px;font-size:1rem;color:var(--muted);font-weight:700}
.clear{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.95rem;font-weight:700}
.clear.confirm{border-color:var(--tomato);color:var(--tomato)}

.bottom{background:var(--surface);border-top:1px solid var(--line);padding-block:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.sugs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sug{flex:none;border:1px solid var(--leaf);background:var(--leaf-soft);color:var(--leaf);border-radius:999px;padding:9px 16px;font-size:1.1rem;font-weight:700;white-space:nowrap}
.sug .plus{opacity:.7;margin-inline-end:4px}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:14px 18px;font:inherit;font-size:1.15rem;color:var(--fg)}
.send{border:0;background:var(--leaf);color:#fff;border-radius:999px;padding:0 22px;font-size:1.1rem;font-weight:700;flex:none}
.send:disabled{opacity:.5;cursor:default}
.hint{font-size:.9rem;color:var(--muted);margin-top:6px;text-align:center}

.picker{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.picker h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;color:var(--leaf)}
.picker p{margin:0;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:420px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700}
.person .av{width:44px;height:44px;font-size:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;z-index:30;white-space:nowrap}
.av.emo{background:var(--sunk)!important;font-size:1.25rem}
.emoji{font-size:1.4rem;width:30px;text-align:center;flex:none}
.item.done .emoji{opacity:.5}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flash{0%{background:var(--leaf-soft)}100%{background:var(--surface)}}
.check.pop{animation:pop .35s ease-out}
.item.flash{animation:flash .6s ease-out}
.king{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fff6d8,#fffbee);border:1px solid #f1dc94;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.king .crown{font-size:2rem;line-height:1}
.king b{font-size:1.1rem}
.king small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.sheet{position:fixed;inset:0;background:rgba(29,42,31,.35);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--leaf)}
.emos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:46vh;overflow-y:auto;padding:2px}
.emohead{grid-column:1/-1;font-weight:700;color:var(--muted);font-size:.95rem;margin-top:6px}
.emos button{font-size:1.9rem;background:var(--sunk);border:2px solid transparent;border-radius:14px;aspect-ratio:1;padding:0}
.emos button.sel{border-color:var(--leaf);background:var(--leaf-soft)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet-actions button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:12px;font-weight:700}
.sheet-actions .primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.item.urgent{border-color:var(--tomato);background:#fff3ef}
.item.urgent .iname::after{content:" 🔥";}
.acts{display:flex;align-items:center;gap:2px;flex:none}
.ibtn{border:0;background:none;font-size:1.3rem;padding:4px;line-height:1;opacity:.35;filter:grayscale(1)}
.ibtn.on{opacity:1;filter:none}
.likes{display:inline-block;margin-inline-start:6px;font-size:.95rem;color:var(--tomato);font-weight:700}
@keyframes heart{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-120%) scale(1.8);opacity:0}}
.bigheart{position:fixed;font-size:3rem;pointer-events:none;z-index:45;animation:heart .8s ease-out forwards}
.shop{display:flex;align-items:center;gap:10px;background:#e8f1ff;border:1px solid #b8cff5;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:700}
.shop .t{flex:1;min-width:0}
.shop small{display:block;font-weight:400;color:var(--muted);font-size:.88rem}
.shop button{border:0;background:#2563eb;color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;flex:none}
.shopbtn{border:1px solid #b8cff5;background:#e8f1ff;color:#1d4ed8;border-radius:999px;padding:8px 14px;font-weight:700;width:100%;margin-bottom:14px}
.bday{background:linear-gradient(90deg,#ffe4ef,#fff1d6);border:1px solid #f6b8cf;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:1.15rem;text-align:center}
.bdayrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bdayrow label{font-weight:700}
.bdayrow select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
@keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-120vh)}}
.balloon{position:fixed;bottom:-80px;font-size:3rem;pointer-events:none;z-index:40;animation:rise linear forwards}
.bin{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));font-size:3.4rem;line-height:1;z-index:49;pointer-events:none}
.flyer{position:fixed;margin:0;z-index:50;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.banner{background:var(--tomato);color:#fff;padding:8px;text-align:center;font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner" hidden></div>
  <header class="wrap">
    <div class="top">
      <h1>הקניות של הבית <span class="count" id="count" hidden>0</span></h1>
      <div style="display:flex;gap:8px;align-items:center"><button class="mute" id="muteBtn" type="button" aria-label="השתקה"></button><button class="me" id="meBtn" title="החלפת משתמש"><span id="meAv"></span><span id="meName"></span></button></div>
    </div>
  </header>

  <main class="pane wrap"><div id="bday" class="bday" hidden></div><div id="shop"></div><div id="king" hidden></div><div id="list"></div></main>

  <div class="bottom wrap">
    <div class="sugs" id="sugs" hidden></div>
    <form class="composer" id="composer">
      <input id="input" autocomplete="off" autocorrect="off" enterkeyhint="done" placeholder="מה צריך לקנות?" aria-label="פריט חדש">
      <button class="send" id="sendBtn" type="submit" disabled>הוסף</button>
    </form>
    <div class="hint">אפשר כמה ביחד: <b>מלפפונים, 2 חלב, נקניק</b></div>
  </div>
</div>

<div class="picker" id="picker" hidden>
  <h2>מי נכנס?</h2>
  <p>בחרו את השם שלכם</p>
  <div class="people" id="people"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="האווטאר שלי">
    <h3 id="sheetTitle">בחרו אווטאר</h3>
    <div class="emos" id="emos"></div>
    <div class="bdayrow"><label for="bdD">🎂 יום הולדת:</label>
      <select id="bdD" aria-label="יום"></select><select id="bdM" aria-label="חודש"></select></div>
    <div class="sheet-actions">
      <button id="switchUser" type="button">לא אני – החלפת משתמש</button>
      <button id="closeSheet" class="primary" type="button">סגור</button>
    </div>
  </div>
</div>
<canvas id="confetti" hidden></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {

];
// Common Israeli supermarket items, used for suggestions before the family builds its own history
const COMMON = ["חלב","לחם","ביצים","מלפפונים","עגבניות","בצל","תפוחי אדמה","גמבה","גזר","חסה","לימונים","שום","תפוחים","בננות","אבוקדו","קוטג׳","גבינה צהובה","גבינה לבנה","שמנת מתוקה","שמנת חמוצה","יוגורט","חמאה","מעדנים","נקניק","פסטרמה","חזה עוף","שניצל","בשר טחון","פרגיות","דג סלמון","טונה","אורז","פסטה","קמח","סוכר","מלח","שמן קנולה","שמן זית","קטשופ","מיונז","חומוס","טחינה","פיתות","לחמניות","פתיתים","קורנפלקס","שוקו","קפה","תה","מים מינרליים","קולה","מיץ","במבה","ביסלי","עוגיות","שוקולד","גלידה","נייר טואלט","מגבות נייר","סבון כלים","אבקת כביסה","מרכך כביסה","שקיות זבל","שמפו","משחת שיניים","תירס","זיתים","מלפפון חמוץ","חציל","קישואים","פטרוזיליה","כוסברה","שמיר"];
const AVATAR_GROUPS=[["חיות", ["🦁", "🐼", "🦊", "🐯", "🐨", "🐸", "🐵", "🙈", "🐶", "🐱", "🐰", "🐻", "🐧", "🦖", "🦕", "🐙", "🦋", "🐢", "🦈", "🐬", "🐳", "🦒", "🦓", "🐘", "🦛", "🦔", "🦥", "🦦", "🦩", "🦉", "🦜", "🐝", "🐞", "🐌", "🦄", "🐲", "🐷", "🐮", "🐔", "🐣", "🦀", "🐊"]], ["דמויות", ["🧙", "🧛", "🧜", "🧚", "🧞", "🧟", "🦸", "🦹", "🥷", "🤴", "👸", "🤶", "🎅", "👼", "🧑‍🚀", "👮", "🕵", "🧑‍🍳", "🧑‍🎤", "👷", "💂", "🤠", "🧝", "🧌", "🎃", "🤺", "🏄", "🧘"]], ["פרצופים מצחיקים", ["😎", "🤓", "🥸", "🤪", "😜", "🤡", "👻", "💀", "👽", "👾", "🤖", "💩", "😈", "🙃", "🤩", "🥳", "😴", "🤯", "🥶", "🫠", "🤑", "🤗", "😺", "🙀", "😹", "🤫", "🫡", "😇"]], ["אוכל", ["🍕", "🍔", "🌭", "🍟", "🌮", "🍩", "🍦", "🍪", "🧁", "🍉", "🍓", "🥑", "🌶️", "🍿", "🥨", "🧀", "🍣", "🥐"]], ["ספורט ועוד", ["⚽", "🏀", "🎾", "🏓", "🎮", "🎸", "🥁", "🎨", "🚀", "🛸", "🌈", "⭐", "🔥", "⚡", "👑", "💎", "🎈", "🌸", "🌵", "🍀", "🦷", "🧠"]]];
const AVATARS=AVATAR_GROUPS.flatMap(g=>g[1]);
// emoji per item: first matching keyword wins
const EMO=[["מלפפון חמוץ","🥒"],["מלפפון","🥒"],["עגבני","🍅"],["תפוחי אדמה","🥔"],["תפוח אדמה","🥔"],["בטטה","🍠"],["תפוח","🍎"],["בננ","🍌"],["אבוקדו","🥑"],["לימון","🍋"],["תפוז","🍊"],["קלמנטינ","🍊"],["ענב","🍇"],["אבטיח","🍉"],["מלון","🍈"],["אגס","🍐"],["אפרסק","🍑"],["דובדבן","🍒"],["אננס","🍍"],["מנגו","🥭"],["גזר","🥕"],["בצל","🧅"],["שום","🧄"],["גמבה","🫑"],["פלפל","🌶️"],["חציל","🍆"],["תירס","🌽"],["חסה","🥬"],["כרוב","🥬"],["ברוקולי","🥦"],["פטרי","🍄"],["פטרוזיליה","🌿"],["כוסברה","🌿"],["שמיר","🌿"],["נענע","🌿"],["זית","🫒"],["חלב","🥛"],["שוקו","🧋"],["גבינ","🧀"],["קוטג","🧀"],["יוגורט","🥣"],["מעדנ","🍮"],["חמאה","🧈"],["ביצ","🥚"],["לחמני","🥯"],["לחם","🍞"],["פית","🫓"],["תות","🍓"],["באגט","🥖"],["קרואסון","🥐"],["עוף","🍗"],["פרגי","🍗"],["שניצל","🍗"],["נקניק","🌭"],["פסטרמה","🥓"],["בשר","🥩"],["סטייק","🥩"],["המבורגר","🍔"],["דגני","🥣"],["דג","🐟"],["סלמון","🐟"],["טונה","🐟"],["אורז","🍚"],["פסט","🍝"],["ספגטי","🍝"],["פתיתים","🍚"],["קמח","🌾"],["סוכר","🍬"],["מלח","🧂"],["שמן","🫗"],["קטשופ","🍅"],["חומוס","🫘"],["טחינה","🥣"],["דבש","🍯"],["ריבה","🍓"],["קורנפלקס","🥣"],["קפה","☕"],["תה","🍵"],["מים","💧"],["קולה","🥤"],["מיץ","🧃"],["ביר","🍺"],["יין","🍷"],["במבה","🥜"],["ביסלי","🥨"],["צ׳יפס","🍟"],["צ'יפס","🍟"],["עוגי","🍪"],["עוגה","🍰"],["שוקולד","🍫"],["ממתק","🍬"],["סוכרי","🍭"],["גלידה","🍦"],["פיצה","🍕"],["נייר טואלט","🧻"],["מגבות","🧻"],["טישו","🧻"],["סבון","🧼"],["כביסה","🧺"],["מרכך","🧺"],["שקיות","🛍️"],["שמפו","🧴"],["משחת שיניים","🪥"],["מברשת","🪥"],["חיתול","👶"],["סוללה","🔋"],["נורה","💡"],["אוכל לכלב","🐶"],["אוכל לחתול","🐱"],["פרחים","💐"],["תבלין","🧂"]];
const FIN={"ן":"נ","ם":"מ","ץ":"צ","ף":"פ","ך":"כ","׳":"'"};
function fin(x){return x.replace(/[ןםץףך׳]/g,c=>FIN[c])}
function emojiFor(name){const n=fin(name);for(const [k,e] of EMO){if(n.includes(fin(k)))return e}return "🛒"}

function av(id){const p=P[id]||{name:"?",color:"#777"};const s=document.createElement("span");s.className="av";const e=(profiles[id]||{}).emoji;
  if(e){s.classList.add("emo");s.style.background="";s.textContent=e}else{s.style.background=p.color;s.textContent=p.name[0]}return s}
function nm(id){return (P[id]||{}).name||"מישהו"}

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function norm(s){return s.trim().replace(/\s+/g," ").replace(/[״"]/g,'"').replace(/[׳']/g,"'")}
function when(ts){
  if(!ts) return "";
  const d=new Date(ts), now=new Date();
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const diff=Math.round((day(now)-day(d))/864e5);
  const hm=d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
  if(diff===0) return "היום "+hm;
  if(diff===1) return "אתמול "+hm;
  if(diff<7) return "לפני "+diff+" ימים";
  return d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
}

/* ---------- parsing "2 חלב, מלפפונים ונקניק" ---------- */
function parse(text){
  return text.split(/\s*[,،\n]\s*|\s+ו(?=[^\s])(?=\S{2,})/).map(s=>s.trim()).filter(Boolean).map(s=>{
    let qty=null, m;
    if((m=s.match(/^(\d+)\s*[x×]?\s+(.+)$/))) {qty=+m[1]; s=m[2]}
    else if((m=s.match(/^(.+?)\s+[x×]?\s*(\d+)$/))) {qty=+m[2]; s=m[1]}
    return {name:s.trim(), qty};
  }).filter(x=>x.name);
}

/* ---------- king of requests ---------- */
const KING_FROM=1792561625000; // reset: tests before this moment are not counted
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function renderKing(){
  const box=$("king"),now=new Date(),start=Math.max(new Date(now.getFullYear(),now.getMonth(),1).getTime(),KING_FROM);
  const counts={},per={};
  all.filter(i=>i.createdAt>=start).forEach(i=>(i.requesters||[]).forEach(r=>{
    counts[r]=(counts[r]||0)+1;per[r]=per[r]||{};const k=norm(i.name);per[r][k]=(per[r][k]||0)+1}));
  const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length||ranked[0][1]<3){box.hidden=true;return}
  const [kid,n]=ranked[0];
  const fav=Object.entries(per[kid]).sort((a,b)=>b[1]-a[1])[0];
  const line=fav&&fav[1]>=2?nm(kid)+" ביקש/ה "+fav[0]+" "+fav[1]+" פעמים החודש 😄":"הכי הרבה בקשות ב"+MONTHS[now.getMonth()];
  box.replaceChildren();box.className="king";
  const c=document.createElement("span");c.className="crown";c.textContent="👑";
  const t=document.createElement("div");const b=document.createElement("b");b.textContent="מלך הבקשות: "+nmA(kid)+" ("+n+")";
  const sm=document.createElement("small");sm.textContent=line;t.append(b,sm);box.append(c,t);box.hidden=false;
}

  if(!has&&e){const h=document.createElement("div");h.className="bigheart";h.textContent="❤️";h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";document.body.append(h);setTimeout(()=>h.remove(),850);pop()}

}

/* ---------- pop sound + confetti ---------- */
let actx=null, muted=store.get("muted")==="1";
function pop(){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type="sine";o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(880,t+.06);
  g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.16)}catch(e){}}
function tada(){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+k*.11;
  o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.36)})}catch(e){}}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){toast("כל הכבוד! הכול נקנה 🎉");return}
  const cv=$("confetti"),ctx=cv.getContext("2d");cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#2f7a4a","#d9482b","#f2b705","#3b82f6","#ec4899","#8b5cf6"];
  const ps=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,
    vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(t){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(t-t0<3200)requestAnimationFrame(frame);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})(t0);
  toast("כל הכבוד! הכול נקנה 🎉");
}

/* ---------- autocomplete ---------- */
function suggestions(q){
  q=norm(q); if(!q) return [];
  const last=q.split(/\s*,\s*/).pop(); if(!last) return [];
  const freq={};
  all.forEach(i=>{const k=norm(i.name);freq[k]=(freq[k]||0)+5});      // family history weighs most
  COMMON.forEach(c=>{const k=norm(c);freq[k]=(freq[k]||0)+1});
  const onList=new Set(all.filter(i=>!i.archived&&!i.done).map(i=>norm(i.name)));
  const names=Object.keys(freq).filter(n=>n!==last&&!onList.has(n));
  const starts=names.filter(n=>n.startsWith(last)), has=names.filter(n=>!n.startsWith(last)&&n.includes(last));
  const by=(a,b)=>freq[b]-freq[a];
  return [...starts.sort(by),...has.sort(by)].slice(0,8);
}
function renderSugs(){
  const box=$("sugs"),val=$("input").value,list=suggestions(val);
  box.replaceChildren();box.hidden=!list.length;
  list.forEach(n=>{
    const b=document.createElement("button");b.type="button";b.className="sug";
    const p=document.createElement("span");p.className="plus";p.textContent="+";b.append(p,n);
    b.onclick=async()=>{
      const parts=val.split(",");parts.pop();           // keep earlier comma-separated parts
      const before=parts.join(",").trim();
      $("input").value="";$("sendBtn").disabled=true;renderSugs();
      await addText((before?before+", ":"")+n);
      $("input").focus();
    };
    box.append(b);
  });
}

/* ---------- data ---------- */
async function addText(text){
  if(!db){offline("אין חיבור לשמירה");return}
  const parsed=parse(text);const names=[];
  for(const {name,qty} of parsed){
    const ex=all.find(i=>!i.archived&&!i.done&&norm(i.name)===norm(name));
    try{
      if(ex){
        const reqs=Array.from(new Set([...(ex.requesters||[]),me]));
        const upd={requesters:reqs}; if(qty) upd.qty=qty;
        await db.collection("items").doc(ex.id).update(upd);
      }else{
        await db.collection("items").add({name,qty:qty||null,requesters:[me],createdAt:Date.now(),done:false,doneBy:null,doneAt:null,archived:false});
      }
      names.push(name);
    }catch(e){toast("לא הצלחתי להוסיף את "+name)}
  }
  if(names.length) toast("נוסף: "+names.join(", "));
}
async function toggle(i){
  if(!i.done){
    pop();const el=document.querySelector('.item[data-id="'+i.id+'"]');
    if(el){el.classList.add("flash");el.querySelector(".check").classList.add("pop")}
    const openLeft=all.filter(x=>!x.archived&&!x.done&&x.id!==i.id).length;
    if(openLeft===0) setTimeout(()=>{tada();confetti()},250);
    await new Promise(r=>setTimeout(r,280));
  }
  try{await db.collection("items").doc(i.id).update(i.done?{done:false,doneBy:null,doneAt:null}:{done:true,doneBy:me,doneAt:Date.now()})}catch(e){toast("לא נשמר, נסו שוב")}}
async function removeItem(i){
  const el=document.querySelector('.item[data-id="'+i.id+'"]');
  if(el&&!matchMedia("(prefers-reduced-motion: reduce)").matches){try{await throwToBin(el)}catch(e){}}
  try{await db.collection("items").doc(i.id).delete()}catch(e){toast("לא נמחק, נסו שוב")}
}
function thud(){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.18);
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.23);
  const n=actx.createBufferSource(),b=actx.createBuffer(1,actx.sampleRate*.12,actx.sampleRate),d=b.getChannelData(0);
  for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*(1-k/d.length);
  const ng=actx.createGain();ng.gain.value=.03;n.buffer=b;n.connect(ng).connect(actx.destination);n.start(t)}catch(e){}}
async function throwToBin(el){
  const r=el.getBoundingClientRect();
  const bin=document.createElement("div");bin.className="bin";bin.textContent="🗑️";document.body.append(bin);
  const fl=el.cloneNode(true);fl.classList.add("flyer");
  Object.assign(fl.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  document.body.append(fl);el.style.visibility="hidden";
  await bin.animate([{transform:"scale(0) rotate(-20deg)"},{transform:"scale(1.15) rotate(5deg)"},{transform:"scale(1)"}],{duration:220,easing:"ease-out",fill:"forwards"}).finished;
  const b=bin.getBoundingClientRect();
  const dx=(b.left+b.width/2)-(r.left+r.width/2), dy=(b.top+b.height/2)-(r.top+r.height/2);
  await fl.animate([
    {transform:"translate(0,0) rotate(0) scale(1)",opacity:1},
    {transform:`translate(${dx*.45}px,${dy*.45-140}px) rotate(-200deg) scale(.45)`,opacity:1,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(-400deg) scale(.08)`,opacity:.7}
  ],{duration:620,easing:"cubic-bezier(.35,.0,.65,1)",fill:"forwards"}).finished;
  fl.remove();thud();
  await bin.animate([{transform:"rotate(0)"},{transform:"rotate(-14deg)"},{transform:"rotate(12deg)"},{transform:"rotate(-6deg)"},{transform:"rotate(0)"}],{duration:380}).finished;
  bin.animate([{opacity:1},{opacity:0,transform:"translateY(20px)"}],{duration:250,fill:"forwards"}).finished.then(()=>bin.remove());
}
async function archiveDone(list){for(const i of list){try{await db.collection("items").doc(i.id).update({archived:true,archivedAt:Date.now()})}catch(e){}}toast("הרשימה נוקתה")}

/* ---------- input ---------- */
$("input").addEventListener("input",()=>{$("sendBtn").disabled=!$("input").value.trim();renderSugs()});
$("composer").addEventListener("submit",async e=>{
  e.preventDefault();const v=$("input").value.trim();if(!v||!me)return;
  $("input").value="";$("sendBtn").disabled=true;renderSugs();
  await addText(v);
});

/* ---------- start ---------- */
drawMute();
const fromHash=(location.hash||"").slice(1).toLowerCase();
if(P[fromHash]) setMe(fromHash); else if(P[store.get("me")]) setMe(store.get("me")); else showPicker();
render();
try{
  firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore();
  db.collection("items").orderBy("createdAt","desc").limit(800).onSnapshot(s=>{
    all=s.docs.map(d=>({id:d.id,...d.data()}));render();
  },()=>offline("אין חיבור לרשימה – בדקו אינטרנט ורעננו"));
  db.collection("status").doc("shopping").onSnapshot(d=>{shopping=d.exists?d.data():null;renderShop()},()=>{});
  db.collection("profiles").onSnapshot(s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data());refreshMe();render()},()=>{});
}catch(e){offline("שגיאה בחיבור לנתונים")}
</script>
