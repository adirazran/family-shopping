<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קניות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}</style>
<title>הקניות של הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
</head>
<body>
<style>
/* Layout: one-screen app — header + tabs on top, scrolling pane, composer pinned to the bottom. Market-stall palette: leaf green, tomato, paper. */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --sunk:#e7ebe0; --fg:#1d2a1f; --muted:#5f6d60;
  --leaf:#2f7a4a; --leaf-soft:#d9eedd; --tomato:#d9482b; --line:#d5dccd;
  --mine:#dff1df; --done:#8a958b;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121813; --surface:#1b231c; --sunk:#232d24; --fg:#e8eee6; --muted:#9aa89b;
  --leaf:#5cbf7d; --leaf-soft:#1f3a27; --tomato:#ff7559; --line:#2e3a2f;
  --mine:#21402a; --done:#6f7b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1b231c; --sunk:#232d24; --fg:#e8eee6; --muted:#9aa89b;
  --leaf:#5cbf7d; --leaf-soft:#1f3a27; --tomato:#ff7559; --line:#2e3a2f;
  --mine:#21402a; --done:#6f7b70; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.app{direction:rtl;height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{padding-block:14px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;color:var(--leaf);text-wrap:balance}
.me{display:flex;align-items:center;gap:8px;background:var(--sunk);border:0;border-radius:999px;padding:4px 12px 4px 4px;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-weight:700;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--leaf)}
.count{background:var(--tomato);color:#fff;border-radius:999px;font-size:.75rem;min-width:22px;padding:1px 7px;font-variant-numeric:tabular-nums}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;flex:none}

.pane{flex:1;overflow-y:auto;padding-block:16px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;line-height:1.6}
.empty strong{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem;color:var(--fg);margin-bottom:4px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 12px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.row.mine{align-self:flex-start;flex-direction:row}
.row.other{align-self:flex-end;flex-direction:row-reverse}
.row.mine .av{display:none}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px 6px;min-width:0}
.row.mine .bubble{background:var(--mine);border-color:transparent;border-bottom-right-radius:4px}
.row.other .bubble{border-bottom-left-radius:4px}
.who{font-weight:700;font-size:.85rem;margin-bottom:2px}
.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.addbtn{border:1px solid var(--leaf);color:var(--leaf);background:transparent;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.addbtn:hover{background:var(--leaf-soft)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{background:var(--leaf-soft);color:var(--leaf);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700}
.quick{margin-top:8px;display:flex;gap:6px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font:inherit;color:var(--fg)}
.quick button{border:0;background:var(--leaf);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
.quick .x{background:var(--sunk);color:var(--fg)}

/* list */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--leaf);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.item.done .check{background:var(--leaf);border-color:var(--leaf)}
.check svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.item.done .check svg{opacity:1}
.iname{flex:1;min-width:0;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.item.done .iname{text-decoration:line-through;color:var(--done);font-weight:600}
.req{font-size:.85rem;color:var(--muted);text-align:left;flex:none}
.req b{color:var(--fg)}
.item.done .req{color:var(--done)}
.del{border:0;background:none;color:var(--muted);font-size:1.2rem;padding:0 4px;line-height:1}
.del:hover{color:var(--tomato)}
.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 8px;font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-weight:700}
.clear{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700}
.clear.confirm{border-color:var(--tomato);color:var(--tomato)}

/* composer */
.composer{background:var(--surface);border-top:1px solid var(--line);padding-block:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:11px 16px;font:inherit;color:var(--fg)}
.send{border:0;background:var(--leaf);color:#fff;border-radius:999px;padding:0 18px;font-weight:700;flex:none}
.send:disabled{opacity:.5;cursor:default}

/* name picker */
.picker{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;direction:rtl;padding:24px}
.picker h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;color:var(--leaf)}
.picker p{margin:0;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:420px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700}
.person .av{width:44px;height:44px;font-size:1.1rem}
.person:hover{border-color:var(--leaf)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;z-index:30;direction:rtl}
.banner{background:var(--tomato);color:#fff;padding:8px;text-align:center;font-weight:600;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.item,.bubble{transition:background .2s}}
</style>

<div class="app" id="app">
  <div class="banner" id="banner" hidden></div>
  <header class="wrap">
    <div class="top">
      <h1>הקניות של הבית</h1>
      <button class="me" id="meBtn" title="החלפת משתמש"><span id="meAv"></span><span id="meName"></span></button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabChat" aria-selected="true">שיחה</button>
      <button class="tab" role="tab" id="tabList" aria-selected="false">רשימה <span class="count" id="count" hidden>0</span></button>
    </div>
  </header>

  <main class="pane wrap" id="paneChat"><div class="msgs" id="msgs"></div></main>
  <main class="pane wrap" id="paneList" hidden><div id="list"></div></main>

  <form class="composer wrap" id="composer">
    <input id="input" autocomplete="off" placeholder="כתבו הודעה…" aria-label="הודעה">
    <button class="send" id="sendBtn" type="submit" disabled>שלח</button>
  </form>
</div>

<div class="picker" id="picker" hidden>
  <h2>מי נכנס?</h2>
  <p>בחרו את השם שלכם</p>
  <div class="people" id="people"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Firebase project: family-shopping-34c23 */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDPAeg0sBWK1o7_Wg5R7_SdxheCx2z--0s",
  authDomain: "family-shopping-34c23.firebaseapp.com",
  projectId: "family-shopping-34c23",
  storageBucket: "family-shopping-34c23.firebasestorage.app",
  messagingSenderId: "873812949814",
  appId: "1:873812949814:web:d9284b7580408364cd9197"
};
const PEOPLE = [
  {id:"moran", name:"מורן", color:"#c2410c"},
  {id:"adir",  name:"אדיר", color:"#1d4ed8"},
  {id:"may",   name:"מאי",  color:"#be185d"},
  {id:"noy",   name:"נוי",  color:"#7c3aed"},
  {id:"liam",  name:"ליאם", color:"#0f766e"},
  {id:"lia",   name:"ליה",  color:"#b45309"},
  {id:"yanai", name:"ינאי", color:"#4d7c0f"},
];
const P = Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let me = null, tab = "chat", db = null;
let messages = [], items = [], openQuick = null, clearArmed = false;

function av(id){const p=P[id]||{name:"?",color:"#777"};const s=document.createElement("span");s.className="av";s.style.background=p.color;s.textContent=p.name[0];return s}
function nm(id){return (P[id]||{}).name||"מישהו"}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
function norm(s){return s.trim().replace(/\s+/g," ").toLowerCase()}

/* ---------- who am I ---------- */
function setMe(id){
  me=id; store.set("me",id);
  try{history.replaceState(null,"",location.pathname+"#"+id)}catch(e){}
  $("meAv").replaceChildren(av(id)); $("meName").textContent=P[id].name;
  $("picker").hidden=true; renderChat(); renderList();
}
function showPicker(){
  const box=$("people"); box.replaceChildren();
  PEOPLE.forEach(p=>{const b=document.createElement("button");b.className="person";b.append(av(p.id),document.createTextNode(p.name));b.onclick=()=>{setMe(p.id)};box.append(b)});
  $("picker").hidden=false;
}
$("meBtn").onclick=showPicker;
const fromHash=(location.hash||"").slice(1).toLowerCase();
if(P[fromHash]) setMe(fromHash); else if(P[store.get("me")]) setMe(store.get("me")); else showPicker();

/* ---------- tabs ---------- */
function setTab(t){
  tab=t;
  $("tabChat").setAttribute("aria-selected",t==="chat");$("tabList").setAttribute("aria-selected",t==="list");
  $("paneChat").hidden=t!=="chat";$("paneList").hidden=t!=="list";
  $("input").placeholder = t==="chat" ? "כתבו הודעה…" : "הוסיפו פריט לרשימה…";
  $("sendBtn").textContent = t==="chat" ? "שלח" : "הוסף";
  if(t==="chat") scrollDown();
}
$("tabChat").onclick=()=>setTab("chat");$("tabList").onclick=()=>setTab("list");

/* ---------- chat ---------- */
function fmtTime(ts){const d=new Date(ts);return d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}
function fmtDay(ts){const d=new Date(ts),t=new Date();const y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return "היום";if(d.toDateString()===y.toDateString())return "אתמול";
  return d.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"})}
function scrollDown(){const p=$("paneChat");requestAnimationFrame(()=>p.scrollTop=p.scrollHeight)}

function renderChat(){
  const box=$("msgs");const atBottom=$("paneChat").scrollHeight-$("paneChat").scrollTop-$("paneChat").clientHeight<80;
  box.replaceChildren();
  if(!messages.length){box.innerHTML='<div class="empty"><strong>עוד אין הודעות</strong>כתבו למטה מה צריך לקנות.<br>ליד כל הודעה יופיע כפתור <b>+ לרשימה</b>.</div>';return}
  let lastDay="";
  messages.forEach(m=>{
    const day=fmtDay(m.ts); if(day!==lastDay){const d=document.createElement("div");d.className="day";d.textContent=day;box.append(d);lastDay=day}
    const row=document.createElement("div");row.className="row "+(m.author===me?"mine":"other");
    const b=document.createElement("div");b.className="bubble";
    if(m.author!==me){const w=document.createElement("div");w.className="who";w.style.color=(P[m.author]||{}).color;w.textContent=nm(m.author);b.append(w)}
    const t=document.createElement("div");t.className="text";t.textContent=m.text;b.append(t);
    if(m.added&&m.added.length){const tg=document.createElement("div");tg.className="tags";m.added.forEach(a=>{const s=document.createElement("span");s.className="tag";s.textContent="✓ "+a;tg.append(s)});b.append(tg)}
    if(openQuick===m.id){
      const f=document.createElement("form");f.className="quick";
      const inp=document.createElement("input");inp.value=m.text;inp.setAttribute("aria-label","שם הפריט");inp.id="q-"+m.id;
      const ok=document.createElement("button");ok.textContent="הוסף";ok.type="submit";
      const x=document.createElement("button");x.textContent="ביטול";x.type="button";x.className="x";x.onclick=()=>{openQuick=null;renderChat()};
      f.append(inp,ok,x);
      f.onsubmit=async e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;openQuick=null;await addItem(v,m.author,m);};
      b.append(f);setTimeout(()=>{inp.focus();inp.select()},0);
    }
    const meta=document.createElement("div");meta.className="meta";
    const add=document.createElement("button");add.className="addbtn";add.textContent="+ לרשימה";add.onclick=()=>{openQuick=m.id;renderChat()};
    const tm=document.createElement("span");tm.textContent=fmtTime(m.ts);
    meta.append(add,tm);b.append(meta);
    if(m.author!==me)row.append(av(m.author));
    row.append(b);box.append(row);
  });
  if(atBottom)scrollDown();
}

/* ---------- list ---------- */
function renderList(){
  const box=$("list");box.replaceChildren();
  const live=items.filter(i=>!i.archived);
  const open=live.filter(i=>!i.done).sort((a,b)=>a.createdAt-b.createdAt);
  const done=live.filter(i=>i.done).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  $("count").hidden=!open.length;$("count").textContent=open.length;
  if(!live.length){box.innerHTML='<div class="empty"><strong>הרשימה ריקה</strong>הוסיפו פריט בשורה למטה, או לחצו <b>+ לרשימה</b> על הודעה בשיחה.</div>';return}
  const mk=(i)=>{
    const el=document.createElement("div");el.className="item"+(i.done?" done":"");
    const c=document.createElement("button");c.className="check";c.setAttribute("aria-label",i.done?"בטל סימון":"סמן כנקנה");
    c.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';c.onclick=()=>toggle(i);
    const n=document.createElement("div");n.className="iname";n.textContent=i.name;
    const r=document.createElement("div");r.className="req";
    if(i.done) r.textContent="נקנה ע״י "+nm(i.doneBy);
    else {r.append("ביקש/ה: ");const bb=document.createElement("b");bb.textContent=(i.requesters||[]).map(nm).join(", ");r.append(bb)}
    el.append(c,n,r);
    if(!i.done){const d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","מחק פריט");d.onclick=()=>removeItem(i);el.append(d)}
    return el;
  };
  if(open.length){const l=document.createElement("div");l.className="list";open.forEach(i=>l.append(mk(i)));box.append(l)}
  else{const e=document.createElement("div");e.className="empty";e.innerHTML="<strong>הכול נקנה 🎉</strong>";box.append(e)}
  if(done.length){
    const s=document.createElement("div");s.className="section";
    const lbl=document.createElement("span");lbl.textContent="נקנו ("+done.length+")";
    const cl=document.createElement("button");cl.className="clear"+(clearArmed?" confirm":"");
    cl.textContent=clearArmed?"ללחוץ שוב לאישור":"סיימנו קנייה – לנקות";
    cl.onclick=()=>{if(!clearArmed){clearArmed=true;renderList();setTimeout(()=>{clearArmed=false;renderList()},4000);return}clearArmed=false;archiveDone(done)};
    s.append(lbl,cl);box.append(s);
    const l=document.createElement("div");l.className="list";done.forEach(i=>l.append(mk(i)));box.append(l);
  }
}

/* ---------- data ---------- */
function offline(msg){$("banner").textContent=msg;$("banner").hidden=false}
async function sendMessage(text){
  if(!db){offline("אין חיבור לשמירה");return}
  try{await db.collection("messages").add({text,author:me,ts:Date.now(),added:[]})}catch(e){toast("ההודעה לא נשלחה, נסו שוב")}
}
async function addItem(name,requester,msg){
  if(!db){offline("אין חיבור לשמירה");return}
  const ex=items.find(i=>!i.archived&&!i.done&&norm(i.name)===norm(name));
  try{
    if(ex){
      const reqs=Array.from(new Set([...(ex.requesters||[]),requester]));
      await db.collection("items").doc(ex.id).update({requesters:reqs});
      toast(ex.name+" כבר ברשימה – נוסף "+nm(requester));
    }else{
      await db.collection("items").add({name,requesters:[requester],createdAt:Date.now(),done:false,doneBy:null,doneAt:null,archived:false});
      toast("נוסף לרשימה: "+name);
    }
    if(msg){await db.collection("messages").doc(msg.id).update({added:[...(msg.added||[]),name]})}
  }catch(e){toast("לא הצלחתי להוסיף, נסו שוב")}
}
async function toggle(i){
  try{await db.collection("items").doc(i.id).update(i.done?{done:false,doneBy:null,doneAt:null}:{done:true,doneBy:me,doneAt:Date.now()})}catch(e){toast("לא נשמר, נסו שוב")}
}
async function removeItem(i){try{await db.collection("items").doc(i.id).delete()}catch(e){toast("לא נמחק, נסו שוב")}}
async function archiveDone(list){for(const i of list){try{await db.collection("items").doc(i.id).update({archived:true,archivedAt:Date.now()})}catch(e){}}toast("הרשימה נוקתה")}

/* ---------- composer ---------- */
$("input").addEventListener("input",()=>$("sendBtn").disabled=!$("input").value.trim());
$("composer").addEventListener("submit",async e=>{
  e.preventDefault();const v=$("input").value.trim();if(!v||!me)return;
  $("input").value="";$("sendBtn").disabled=true;
  if(tab==="chat"){await sendMessage(v);scrollDown()} else await addItem(v,me,null);
});

renderChat();renderList();
(()=>{
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }catch(e){offline("חסרות הגדרות Firebase");return}
  db.collection("messages").orderBy("ts","desc").limit(300).onSnapshot(s=>{
    messages=s.docs.map(d=>({id:d.id,...d.data()})).reverse();renderChat();
  },()=>offline("אין חיבור לשיחה – בדקו אינטרנט ורעננו"));
  db.collection("items").where("archived","==",false).onSnapshot(s=>{
    items=s.docs.map(d=>({id:d.id,...d.data()}));renderList();
  },()=>offline("אין חיבור לרשימה – בדקו אינטרנט ורעננו"));
})();
</script>
</body>
</html>
